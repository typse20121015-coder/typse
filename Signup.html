<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桃園結構工程技師公會-報名系統</title>
    
    <!-- Open Graph (OG) 標籤 -->
    <meta property="og:title" content="桃園結構工程技師公會-報名系統" />
    <meta property="og:description" content="桃園市結構工程技師公會活動報名系統，歡迎踴躍報名參加！" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="shrimp_preview.jpg" />
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-overlay { animation: overlayShow 0.3s ease-out forwards; }
        @keyframes overlayShow { from { opacity: 0; } to { opacity: 1; } }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        /* 自定義按鈕樣式，確保跨瀏覽器一致性 */
        .btn-icon { display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        //  設定區域
        // ==========================================
        
        // ★★★ 請將下方的引號內容替換成您部署後的「網頁應用程式網址」 ★★★
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzjqoz3uzHa6fw7E0w_XdOk1pvrERbO_kR5skR2DXP92HcdMyyh2zXQO9FSmN02B56_cA/exec";
        
        // ==========================================

        const { useState, useEffect } = React;

        // --- 圖示元件 ---
        const IconBase = ({ children, className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`flex-shrink-0 ${className || 'w-5 h-5'}`} {...props}>
                {children}
            </svg>
        );

        const Icons = {
            Users: (props) => <IconBase {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconBase>,
            UserPlus: (props) => <IconBase {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></IconBase>,
            Lock: (props) => <IconBase {...props}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconBase>,
            Plus: (props) => <IconBase {...props}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></IconBase>,
            Trash2: (props) => <IconBase {...props}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconBase>,
            Save: (props) => <IconBase {...props}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></IconBase>,
            CheckCircle: (props) => <IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconBase>,
            Download: (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></IconBase>,
            LogOut: (props) => <IconBase {...props}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></IconBase>,
            Edit: (props) => <IconBase {...props}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></IconBase>,
            X: (props) => <IconBase {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>,
            Minus: (props) => <IconBase {...props}><line x1="5" y1="12" x2="19" y2="12"/></IconBase>,
            Gift: (props) => <IconBase {...props}><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></IconBase>,
            MapPin: (props) => <IconBase {...props}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></IconBase>,
            Info: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></IconBase>,
            AlertTriangle: (props) => <IconBase {...props}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></IconBase>
        };

        // --- UI 共用元件 ---
        const MessageBox = ({ message, onClose }) => (
            <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[70] p-4 modal-overlay">
                <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden fade-in">
                    <div className="p-4 bg-indigo-600 flex justify-between items-center text-white">
                        <h3 className="font-bold flex items-center gap-2"><Icons.Info className="w-5 h-5"/> 系統提示</h3>
                        <button onClick={onClose} className="hover:bg-indigo-700 p-1 rounded-full"><Icons.X className="w-5 h-5"/></button>
                    </div>
                    <div className="p-6 text-gray-700 text-center text-lg">{message}</div>
                    <div className="p-4 border-t flex justify-center bg-gray-50">
                        <button onClick={onClose} className="bg-indigo-600 text-white px-8 py-2 rounded-lg hover:bg-indigo-700 transition">確定</button>
                    </div>
                </div>
            </div>
        );

        const ConfirmBox = ({ message, onConfirm, onCancel }) => (
            <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[70] p-4 modal-overlay">
                <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden fade-in">
                    <div className="p-4 bg-red-500 flex justify-between items-center text-white">
                        <h3 className="font-bold flex items-center gap-2"><Icons.AlertTriangle className="w-5 h-5"/> 確認操作</h3>
                        <button onClick={onCancel} className="hover:bg-red-600 p-1 rounded-full"><Icons.X className="w-5 h-5"/></button>
                    </div>
                    <div className="p-6 text-gray-700 text-center text-lg">{message}</div>
                    <div className="p-4 border-t flex justify-center gap-4 bg-gray-50">
                        <button onClick={onCancel} className="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 transition">取消</button>
                        <button onClick={onConfirm} className="bg-red-500 text-white px-6 py-2 rounded-lg hover:bg-red-600 transition">確定</button>
                    </div>
                </div>
            </div>
        );

        // --- 輔助函式與日期邏輯 ---
        const formatDisplayDate = (d) => {
            if (!d) return '';
            if (d.length === 8) return d.replace(/(\d{4})(\d{2})(\d{2})/, '$1/$2/$3');
            if (d.length === 6) return d.replace(/(\d{2})(\d{2})(\d{2})/, '$1/$2/$3'); 
            return d;
        };

        const isValidDate = (d) => {
            if (!d || d.length !== 8) return false;
            const y = parseInt(d.substring(0, 4), 10);
            const m = parseInt(d.substring(4, 6), 10);
            const day = parseInt(d.substring(6, 8), 10);
            
            if (y < 1900 || y > new Date().getFullYear() + 1) return false;
            if (m < 1 || m > 12) return false;
            if (day < 1 || day > 31) return false;
            if ((m === 4 || m === 6 || m === 9 || m === 11) && day > 30) return false;
            if (m === 2) {
                const isLeap = (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
                if (isLeap && day > 29) return false;
                if (!isLeap && day > 28) return false;
            }
            return true;
        };

        const getMonthFromDateString = (d) => {
            if (!d) return -1;
            if (d.length === 8) return parseInt(d.substring(4, 6), 10); 
            if (d.length === 6) return parseInt(d.substring(2, 4), 10); 
            return -1;
        };

        // --- 活動當日年齡計算邏輯 ---
        const EVENT_DATE_Y = 2026;
        const EVENT_DATE_M = 8;
        const EVENT_DATE_D = 25; // 假設活動在8月底

        const getAgeOnEvent = (dStr) => {
            if (!dStr) return 99; // 防呆
            let y, m, d;
            
            if (dStr.length === 8) {
                y = parseInt(dStr.substring(0, 4), 10);
                m = parseInt(dStr.substring(4, 6), 10);
                d = parseInt(dStr.substring(6, 8), 10);
            } else if (dStr.length === 6) {
                let yy = parseInt(dStr.substring(0, 2), 10);
                y = yy > 30 ? 1900 + yy : 2000 + yy;
                m = parseInt(dStr.substring(2, 4), 10);
                d = parseInt(dStr.substring(4, 6), 10);
            } else {
                return 99;
            }
            
            let age = EVENT_DATE_Y - y;
            let mDiff = EVENT_DATE_M - m;
            if (mDiff < 0 || (mDiff === 0 && EVENT_DATE_D < d)) {
                age--;
            }
            return age;
        };

        const DateDigitInput = ({ value, onChange, placeholder, required, customClass }) => {
            const handleChange = (e) => {
                const rawVal = e.target.value.replace(/\D/g, ''); 
                if (rawVal.length <= 8) {
                    onChange(rawVal);
                }
            };

            let displayValue = value;
            if (value.length > 6) {
                displayValue = `${value.substring(0, 4)}/${value.substring(4, 6)}/${value.substring(6)}`;
            } else if (value.length > 4) {
                displayValue = `${value.substring(0, 4)}/${value.substring(4)}`;
            }

            const isInvalid = value.length > 0 && (value.length !== 8 || !isValidDate(value));
            const baseClass = customClass || "w-full p-3 text-lg";
            
            return (
                <div className="relative w-full">
                    <input 
                        required={required} 
                        type="tel" 
                        inputMode="numeric" 
                        value={displayValue} 
                        onChange={handleChange} 
                        placeholder={placeholder || "如: 1996/05/20"} 
                        className={`${baseClass} border rounded-lg focus:ring-2 focus:outline-none transition-colors appearance-none ${isInvalid ? 'border-red-300 focus:ring-red-200 bg-red-50' : 'border-gray-300 focus:ring-indigo-500'}`} 
                        maxLength="10" 
                    />
                    {value.length === 8 && isValidDate(value) && (
                        <div className="absolute right-3 top-1/2 transform -translate-y-1/2 text-green-500 pointer-events-none">
                            <Icons.CheckCircle className="w-5 h-5"/>
                        </div>
                    )}
                </div>
            );
        };

        const Header = ({ setView, view }) => (
            <header className="bg-indigo-600 text-white shadow-lg sticky top-0 z-50">
                <div className="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                    <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('form')}>
                        <Icons.Users className="w-6 h-6" />
                        <h1 className="text-lg md:text-xl font-bold tracking-wider truncate">公會活動報名系統</h1>
                    </div>
                    <nav className="flex gap-2">
                        <button onClick={() => setView('form')} className={`btn-icon text-xs md:text-sm px-3 py-2 rounded-md transition gap-2 whitespace-nowrap active:scale-95 ${view==='form' ? 'bg-indigo-800' : 'bg-indigo-700 hover:bg-indigo-800'}`}>
                            <Icons.UserPlus className="w-4 h-4" /> 報名
                        </button>
                        <button onClick={() => setView('admin')} className={`btn-icon text-xs md:text-sm px-3 py-2 rounded-md transition gap-2 whitespace-nowrap active:scale-95 ${view==='admin' ? 'bg-indigo-800' : 'bg-indigo-700 hover:bg-indigo-800'}`}>
                            <Icons.Lock className="w-4 h-4" /> 管理
                        </button>
                    </nav>
                </div>
            </header>
        );

        const ImageViewer = ({ src, onClose, title }) => {
            const [scale, setScale] = useState(1);
            return (
                <div className="fixed inset-0 z-[100] bg-black bg-opacity-95 flex flex-col modal-overlay">
                    <div className="flex justify-between items-center p-4 text-white absolute top-0 w-full z-20 bg-gradient-to-b from-black/80 to-transparent">
                        <span className="font-bold text-lg drop-shadow-md">{title}</span>
                        <button onClick={onClose} className="p-2 bg-white/20 hover:bg-white/40 rounded-full transition"><Icons.X className="w-6 h-6"/></button>
                    </div>
                    <div className="flex-1 overflow-auto flex items-center justify-center p-2 relative">
                        <img src={src} alt={title} 
                             className="transition-transform duration-200 origin-center object-contain max-h-full cursor-zoom-in" 
                             style={{ transform: `scale(${scale})` }} 
                             onClick={() => setScale(s => s === 1 ? 2 : 1)} />
                    </div>
                    <div className="absolute bottom-6 left-1/2 transform -translate-x-1/2 flex gap-4 bg-black/60 p-2 rounded-full z-20 shadow-lg border border-gray-700">
                        <button onClick={() => setScale(s => Math.max(1, s - 0.5))} className="text-white p-3 hover:bg-white/20 rounded-full transition active:scale-95"><Icons.Minus className="w-6 h-6"/></button>
                        <button onClick={() => setScale(s => Math.min(4, s + 0.5))} className="text-white p-3 hover:bg-white/20 rounded-full transition active:scale-95"><Icons.Plus className="w-6 h-6"/></button>
                    </div>
                </div>
            );
        };

        const ParkingModal = ({ onClose }) => (
            <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4 backdrop-blur-sm modal-overlay">
                <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all scale-100 fade-in">
                    <div className="p-4 bg-indigo-600 flex justify-between items-center text-white">
                        <h3 className="text-lg font-bold flex items-center gap-2">
                            <Icons.MapPin className="w-5 h-5" /> 停車資訊
                        </h3>
                        <button onClick={onClose} className="hover:bg-indigo-700 p-1 rounded-full transition">
                            <Icons.X className="w-5 h-5" />
                        </button>
                    </div>
                    <div className="p-5 space-y-4 text-gray-700 bg-gray-50">
                        <div className="bg-white p-4 rounded-lg shadow-sm border border-gray-100">
                            <div className="flex items-center gap-2 mb-3 pb-2 border-b border-gray-100">
                                <span className="bg-indigo-100 text-indigo-700 font-bold rounded-full w-7 h-7 flex items-center justify-center flex-shrink-0 text-sm">P</span>
                                <h4 className="font-bold text-lg text-gray-900">釣蝦場專屬停車場</h4>
                            </div>
                            <div className="space-y-4 mt-2">
                                <p className="text-sm text-gray-600 flex items-start gap-2 bg-gray-50 p-3 rounded-lg">
                                    <span className="flex-shrink-0 mt-0.5">📍</span>
                                    <span>325桃園市龍潭區九龍里五福街262巷69之1號</span>
                                </p>
                                <div className="text-sm bg-blue-50 text-gray-800 p-4 rounded-lg border border-blue-100 space-y-3">
                                    <div className="flex items-start gap-2">
                                        <span className="flex-shrink-0 mt-0.5 text-blue-600">🚗</span>
                                        <div className="leading-relaxed font-medium">
                                            戶外附設 <span className="text-blue-700 font-bold mx-1 border-b-2 border-blue-300 pb-0.5">500坪超大專屬免費停車場</span>，大約可容納50輛車。
                                        </div>
                                    </div>
                                    <div className="flex items-start gap-2 pt-3 border-t border-blue-200/60 text-gray-600">
                                        <span className="flex-shrink-0 mt-0.5 text-orange-500"><Icons.Info className="w-4 h-4"/></span>
                                        <div className="leading-relaxed">
                                            因停車位數量有限，恕無法預約保留車位，敬請見諒。
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div className="p-4 bg-white border-t flex justify-center">
                        <button onClick={onClose} className="bg-indigo-600 text-white px-10 py-2.5 rounded-lg hover:bg-indigo-700 transition shadow-sm font-medium text-lg">了解</button>
                    </div>
                </div>
            </div>
        );

        const RegistrationForm = ({ onSubmit, isSubmitting, showMessage, currentMembers, currentGuests, currentTotal }) => {
            const [formData, setFormData] = useState({ memberName: '', memberBirthday: '', memberBringRod: false, guests: [] });
            const [showSuccess, setShowSuccess] = useState(false);

            const handleMemberChange = (e) => {
                const { name, value, type, checked } = e.target;
                setFormData(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
            };
            const handleMemberDateChange = (val) => setFormData(prev => ({ ...prev, memberBirthday: val }));

            // 攜伴移除自備釣竿欄位，僅保留姓名、稱謂、生日
            const addGuest = () => setFormData(prev => ({ ...prev, guests: [...(prev.guests || []), { name: '', relationship: '配偶/伴侶', birthday: '' }] }));
            const removeGuest = (index) => setFormData(prev => ({ ...prev, guests: (prev.guests || []).filter((_, i) => i !== index) }));
            const handleGuestChange = (index, field, value) => {
                setFormData(prev => {
                    const newGuests = [...(prev.guests || [])];
                    newGuests[index] = { ...newGuests[index], [field]: value };
                    return { ...prev, guests: newGuests };
                });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.memberName || formData.memberName.trim() === '') return showMessage("請輸入會員姓名");
                
                if (formData.memberBirthday.length !== 8 || !isValidDate(formData.memberBirthday)) {
                    return showMessage("請檢查會員生日格式，需為西元 8 碼 (如: 1996/05/20)");
                }
                
                if (formData.guests && formData.guests.length > 0) {
                    for (const guest of formData.guests) {
                        if (!guest.name || guest.name.trim() === '') return showMessage("請輸入攜伴姓名");
                        if (guest.birthday.length !== 8 || !isValidDate(guest.birthday)) {
                            return showMessage(`請檢查攜伴「${guest.name || '未命名'}」的生日格式，需為西元 8 碼 (如: 1996/05/20)`);
                        }
                    }
                }

                // --- 額滿防護機制 (總人數不設限，僅限會員上限72) ---
                const safeMembers = currentMembers || 0;
                
                if (safeMembers + 1 > 72) {
                    return showMessage("很抱歉，報名失敗。會員報名人數已達上限 (72人)。");
                }
                
                const success = await onSubmit(formData);
                if (success) setShowSuccess(true);
            };

            if (showSuccess) return (
                <div className="flex flex-col items-center justify-center p-8 bg-white rounded-xl shadow-lg mt-6 text-center fade-in mx-4">
                    <Icons.CheckCircle className="w-20 h-20 text-green-500 mb-4" />
                    <h2 className="text-2xl font-bold text-gray-800 mb-2">報名成功！</h2>
                    <p className="text-gray-600 mb-6">您的資料已成功傳送。</p>
                    <div className="bg-gray-50 p-4 rounded-lg border border-gray-200 text-sm text-gray-500 w-full">感謝您的參與，請靜候活動通知。</div>
                </div>
            );

            return (
                <form onSubmit={handleSubmit} className="bg-white rounded-xl shadow-lg p-4 md:p-8 mt-4 md:mt-0 mx-2 md:mx-0">
                    <div className="flex flex-col md:flex-row md:justify-between md:items-end mb-6 border-b pb-3 gap-3">
                        <h2 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                            <Icons.UserPlus className="text-indigo-600 w-6 h-6" /> 填寫報名資料
                        </h2>
                        <div className="flex flex-wrap gap-2 text-sm">
                            <span className="bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-lg border border-indigo-100 font-bold flex items-center gap-1">
                                <Icons.Users className="w-4 h-4" /> 會員: {currentMembers || 0} / 72
                            </span>
                            <span className="bg-green-50 text-green-700 px-3 py-1.5 rounded-lg border border-green-100 font-bold flex items-center gap-1">
                                <Icons.UserPlus className="w-4 h-4" /> 攜伴: {currentGuests || 0}
                            </span>
                            <span className="bg-gray-100 text-gray-700 px-3 py-1.5 rounded-lg border border-gray-200 font-bold">
                                總人數: {currentTotal || 0} 人
                            </span>
                        </div>
                    </div>
                    
                    <div className="space-y-4 mb-8">
                        <h3 className="font-medium text-gray-800 bg-gray-100 p-3 rounded-lg flex items-center gap-2">
                           <span className="w-1.5 h-5 bg-indigo-500 rounded-full block"></span> 會員本人資訊
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-5 gap-4 p-4 md:p-5 border border-gray-200 rounded-xl relative bg-gray-50 hover:bg-white hover:shadow-md transition-all">
                            <div className="md:col-span-3">
                                <label className="block text-xs font-medium text-gray-500 mb-1 ml-1">會員姓名 *</label>
                                <input required type="text" name="memberName" value={formData.memberName} onChange={handleMemberChange} placeholder="請輸入真實姓名" className="w-full p-3 border border-gray-300 rounded-lg text-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none appearance-none" />
                            </div>
                            <div className="md:col-span-2">
                                <label className="block text-xs font-medium text-gray-500 mb-1 ml-1">會員生日 (YYYY/MM/DD) *</label>
                                <DateDigitInput required value={formData.memberBirthday} onChange={handleMemberDateChange} placeholder="如: 1996/05/20" />
                            </div>
                            <div className="md:col-span-5 mt-1 border-t border-gray-100 pt-3">
                                <label className={`flex items-center gap-2 cursor-pointer p-2.5 rounded-lg border transition-all w-fit select-none ${formData.memberBringRod ? 'bg-indigo-50 border-indigo-300' : 'bg-white border-gray-200 hover:bg-gray-50'}`}>
                                    <input type="checkbox" name="memberBringRod" checked={formData.memberBringRod} onChange={handleMemberChange} className="w-5 h-5 text-indigo-600 rounded cursor-pointer accent-indigo-600" />
                                    <span className={`text-sm font-medium flex items-center gap-1.5 ${formData.memberBringRod ? 'text-indigo-700' : 'text-gray-700'}`}>
                                        我會自備釣竿
                                    </span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div className="space-y-4 mb-8">
                        <div className="flex items-center mb-2 gap-4">
                            <h3 className="font-medium text-gray-800 bg-gray-100 p-3 rounded-lg flex items-center gap-2">
                                <span className="w-1.5 h-5 bg-green-500 rounded-full block"></span> 攜伴 ({formData.guests ? formData.guests.length : 0})
                            </h3>
                            <button type="button" onClick={addGuest} className="btn-icon text-sm bg-green-500 hover:bg-green-600 text-white px-4 py-2.5 rounded-lg gap-2 transition shadow-sm whitespace-nowrap active:scale-95">
                                <Icons.Plus className="w-5 h-5" /> 新增攜伴
                            </button>
                        </div>
                        {(!formData.guests || formData.guests.length === 0) && (
                            <p className="text-sm text-gray-400 italic text-center py-8 border-2 border-dashed border-gray-200 rounded-xl bg-gray-50">目前沒有攜伴，若有請點擊上方「新增攜伴」</p>
                        )}
                        {formData.guests && formData.guests.map((guest, index) => (
                            <div key={index} className="grid grid-cols-1 md:grid-cols-10 gap-4 p-4 md:p-5 border border-gray-200 rounded-xl relative bg-gray-50 hover:bg-white hover:shadow-md transition-all">
                                <div className="md:col-span-4">
                                    <label className="block text-xs font-medium text-gray-500 mb-1 ml-1">攜伴 {index + 1} 姓名</label>
                                    <input required type="text" value={guest.name} onChange={(e) => handleGuestChange(index, 'name', e.target.value)} placeholder="攜伴姓名" className="w-full p-3 border border-gray-300 rounded-lg text-lg focus:outline-none focus:border-indigo-400 appearance-none" />
                                </div>
                                <div className="md:col-span-2">
                                    <label className="block text-xs font-medium text-gray-500 mb-1 ml-1">稱謂</label>
                                    <select value={guest.relationship} onChange={(e) => handleGuestChange(index, 'relationship', e.target.value)} className="w-full p-3 border border-gray-300 rounded-lg text-base bg-white focus:outline-none focus:border-indigo-400">
                                        <option value="配偶/伴侶">配偶/伴侶</option>
                                        <option value="父母">父母</option>
                                        <option value="子女">子女</option>
                                    </select>
                                </div>
                                <div className="md:col-span-4">
                                    <label className="block text-xs font-medium text-gray-500 mb-1 ml-1">攜伴 {index + 1} 生日</label>
                                    <DateDigitInput required value={guest.birthday} onChange={(val) => handleGuestChange(index, 'birthday', val)} placeholder="如: 1996/05/20" />
                                </div>
                                
                                <div className="md:col-span-10 mt-2 flex justify-end border-t border-gray-200 pt-3">
                                    <button type="button" onClick={() => removeGuest(index)} className="btn-icon text-red-500 hover:text-red-700 p-2 bg-white border border-gray-200 hover:border-red-200 rounded-lg transition gap-2 w-full md:w-auto h-full min-h-[44px]">
                                        <Icons.Trash2 className="w-5 h-5" /> <span className="text-sm font-medium">刪除此位</span>
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                    <button type="submit" disabled={isSubmitting} className={`btn-icon w-full py-4 px-6 rounded-xl font-bold text-lg text-white shadow-lg transition transform hover:-translate-y-0.5 active:translate-y-0 gap-2 ${isSubmitting ? 'bg-gray-400 cursor-not-allowed' : 'bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800'}`}>
                        {isSubmitting ? '資料上傳中...' : <><Icons.Save className="w-6 h-6" /> 確認送出報名</>}
                    </button>
                </form>
            );
        };

        const AdminLogin = ({ onLogin }) => {
            const [password, setPassword] = useState('');
            const [error, setError] = useState(false);
            const handleSubmit = (e) => {
                e.preventDefault();
                if (password === 'admin888') onLogin(true);
                else setError(true);
            };
            return (
                <div className="max-w-md mx-auto mt-10 bg-white p-8 rounded-xl shadow-lg border-t-4 border-indigo-600 mx-4">
                    <div className="text-center mb-6">
                        <div className="bg-indigo-50 p-3 rounded-full w-16 h-16 flex items-center justify-center mx-auto mb-4 text-indigo-600"><Icons.Lock className="w-8 h-8" /></div>
                        <h2 className="text-xl font-bold text-gray-800">管理員登入</h2>
                        <p className="text-sm text-gray-500 mt-2">請輸入管理密碼</p>
                    </div>
                    <form onSubmit={handleSubmit} className="space-y-4">
                        <input type="password" placeholder="請輸入密碼" className="w-full p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition text-lg" value={password} onChange={(e) => { setPassword(e.target.value); setError(false); }} />
                        {error && <p className="text-red-500 text-sm text-center">密碼錯誤，請重試。</p>}
                        <button className="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition shadow text-lg">登入後台</button>
                    </form>
                </div>
            );
        };

        const EditModal = ({ data, onClose, onSave, showMessage }) => {
            const [formData, setFormData] = useState({
                ...JSON.parse(JSON.stringify(data)),
                guests: data.guests || []
            });
            
            const handleMemberChange = (e) => {
                const { name, value, type, checked } = e.target;
                setFormData(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
            };
            const handleMemberDateChange = (val) => setFormData(prev => ({ ...prev, memberBirthday: val }));

            const addGuest = () => setFormData(prev => ({ ...prev, guests: [...(prev.guests || []), { name: '', relationship: '配偶/伴侶', birthday: '' }] }));
            const removeGuest = (index) => setFormData(prev => ({ ...prev, guests: (prev.guests || []).filter((_, i) => i !== index) }));
            const handleGuestChange = (index, field, value) => {
                setFormData(prev => {
                    const newGuests = [...(prev.guests || [])];
                    newGuests[index] = { ...newGuests[index], [field]: value };
                    return { ...prev, guests: newGuests };
                });
            };

            const handleSave = () => {
                if (!formData.memberName || formData.memberName.trim() === '') return showMessage("請輸入會員姓名");
                
                if (formData.memberBirthday.length !== 8 || !isValidDate(formData.memberBirthday)) {
                    return showMessage("請檢查會員生日格式，需為西元 8 碼 (如: 1996/05/20)");
                }
                
                if (formData.guests && formData.guests.length > 0) {
                    for (const guest of formData.guests) {
                        if (!guest.name || guest.name.trim() === '') return showMessage("請輸入攜伴姓名");
                        if (guest.birthday.length !== 8 || !isValidDate(guest.birthday)) {
                            return showMessage(`請檢查攜伴「${guest.name || '未命名'}」的生日格式，需為西元 8 碼 (如: 1996/05/20)`);
                        }
                    }
                }
                
                onSave(formData);
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[60] p-4 modal-overlay">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden fade-in flex flex-col max-h-[90vh]">
                        <div className="p-4 bg-indigo-600 flex justify-between items-center text-white">
                            <h3 className="text-lg font-bold flex items-center gap-2"><Icons.Edit className="w-5 h-5"/> 編輯報名資料</h3>
                            <button onClick={onClose} className="hover:bg-indigo-700 p-1 rounded-full"><Icons.X className="w-5 h-5"/></button>
                        </div>
                        
                        <div className="p-5 overflow-y-auto flex-1 space-y-6">
                            <div className="bg-gray-50 p-4 rounded-lg border border-gray-200">
                                <h4 className="font-bold text-gray-700 mb-3 border-b pb-2 flex items-center gap-2">
                                    <span className="w-1.5 h-4 bg-indigo-500 rounded-full block"></span> 會員本人
                                </h4>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-medium text-gray-500 mb-1">姓名</label>
                                        <input type="text" name="memberName" value={formData.memberName} onChange={handleMemberChange} className="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-gray-500 mb-1">生日 (YYYY/MM/DD)</label>
                                        <DateDigitInput 
                                            value={formData.memberBirthday} 
                                            onChange={handleMemberDateChange} 
                                            customClass="w-full p-2.5 text-base border-gray-300 rounded-lg"
                                        />
                                    </div>
                                    <div className="md:col-span-2 mt-1">
                                        <label className={`flex items-center gap-2 cursor-pointer p-2 rounded-lg border transition-all w-fit select-none ${formData.memberBringRod ? 'bg-indigo-50 border-indigo-300' : 'bg-white border-gray-200 hover:bg-gray-50'}`}>
                                            <input type="checkbox" name="memberBringRod" checked={formData.memberBringRod || false} onChange={handleMemberChange} className="w-4 h-4 text-indigo-600 rounded cursor-pointer accent-indigo-600" />
                                            <span className={`text-sm font-medium flex items-center gap-1.5 ${formData.memberBringRod ? 'text-indigo-700' : 'text-gray-700'}`}>
                                                自備釣竿
                                            </span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="bg-gray-50 p-4 rounded-lg border border-gray-200">
                                <div className="flex justify-between items-center mb-3 border-b pb-2">
                                    <h4 className="font-bold text-gray-700 flex items-center gap-2">
                                        <span className="w-1.5 h-4 bg-green-500 rounded-full block"></span> 攜伴資料 ({formData.guests?.length || 0})
                                    </h4>
                                    <button onClick={addGuest} className="bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded text-sm flex items-center gap-1 transition">
                                        <Icons.Plus className="w-4 h-4"/> 新增攜伴
                                    </button>
                                </div>
                                
                                {(!formData.guests || formData.guests.length === 0) ? (
                                    <p className="text-gray-400 text-sm text-center py-4">目前無攜伴資料</p>
                                ) : (
                                    <div className="space-y-4">
                                        {formData.guests.map((guest, index) => (
                                            <div key={index} className="grid grid-cols-1 md:grid-cols-12 gap-3 bg-white p-3 border border-gray-200 rounded-lg relative items-center shadow-sm">
                                                <div className="md:col-span-4">
                                                    <label className="block text-xs font-medium text-gray-500 mb-1">姓名</label>
                                                    <input type="text" value={guest.name} onChange={e => handleGuestChange(index, 'name', e.target.value)} className="w-full p-2 border border-gray-300 rounded-lg outline-none focus:border-indigo-400" />
                                                </div>
                                                <div className="md:col-span-3">
                                                    <label className="block text-xs font-medium text-gray-500 mb-1">稱謂</label>
                                                    <select value={guest.relationship} onChange={e => handleGuestChange(index, 'relationship', e.target.value)} className="w-full p-3 border border-gray-300 rounded-lg bg-white outline-none focus:border-indigo-400">
                                                        <option value="配偶/伴侶">配偶/伴侶</option>
                                                        <option value="父母">父母</option>
                                                        <option value="子女">子女</option>
                                                    </select>
                                                </div>
                                                <div className="md:col-span-5">
                                                    <label className="block text-xs font-medium text-gray-500 mb-1">生日 (8碼)</label>
                                                    <DateDigitInput value={guest.birthday} onChange={val => handleGuestChange(index, 'birthday', val)} customClass="w-full p-2 text-base border-gray-300 rounded-lg" />
                                                </div>

                                                <div className="md:col-span-12 flex justify-end border-t border-gray-100 pt-2 mt-1">
                                                    <button onClick={() => removeGuest(index)} className="text-red-500 hover:bg-red-50 px-3 py-1.5 rounded-lg transition flex items-center gap-1 text-sm border border-transparent hover:border-red-100" title="刪除此位">
                                                        <Icons.Trash2 className="w-4 h-4"/> 刪除此位
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                        
                        <div className="p-4 border-t flex justify-end gap-3 bg-gray-50">
                            <button onClick={onClose} className="px-6 py-2.5 rounded-lg text-gray-600 font-medium hover:bg-gray-200 transition">取消</button>
                            <button onClick={handleSave} className="px-6 py-2.5 bg-indigo-600 font-medium text-white rounded-lg hover:bg-indigo-700 transition shadow-sm">儲存修改</button>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminDashboard = ({ registrations, onLogout, onAction, showMessage, setConfirmDialog }) => {
            const [editingDoc, setEditingDoc] = useState(null);
            
            // 後台顯示數據統計
            const totalMembers = registrations.length;
            const totalGuests = registrations.reduce((acc, curr) => acc + (curr.guests?.length || 0), 0);
            const totalPeople = totalMembers + totalGuests;

            const exportToCSV = () => {
                let csvContent = "\uFEFF序號,報名時間,會員姓名,會員生日,身分,稱謂,對應會員,自備釣竿,備註\n";
                let seq = 1; 
                
                registrations.forEach(reg => {
                    const date = new Date(reg.timestamp).toLocaleString();
                    const mBd = formatDisplayDate(reg.memberBirthday);
                    const mAge = getAgeOnEvent(reg.memberBirthday);
                    const mRemark = mAge < 3 ? "未滿3歲" : "";
                    const mRod = reg.memberBringRod ? "是" : "否";
                    
                    csvContent += `"${seq++}","${date}","${reg.memberName}","${mBd}","會員本人","本人","-","${mRod}","${mRemark}"\n`;
                    
                    if (reg.guests && reg.guests.length > 0) {
                        reg.guests.forEach(guest => {
                            const gAge = getAgeOnEvent(guest.birthday);
                            const gRemark = gAge < 3 ? "未滿3歲" : "";
                            const gRod = "-"; // 攜伴無自備釣竿選項
                            
                            csvContent += `"${seq++}","${date}","${guest.name}","${formatDisplayDate(guest.birthday)}","攜伴","${guest.relationship||'親友'}","${reg.memberName}","${gRod}","${gRemark}"\n`;
                        });
                    }
                });
                
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `參加清單_${new Date().toISOString().slice(0,10)}.csv`;
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };

            const exportBirthdayGiftList = () => {
                let csvContent = "\uFEFF序號,生日月份,姓名,生日,身分,稱謂,對應會員\n";
                const targetMonths = [3, 4, 5, 6, 7, 8, 9, 10]; // 可根據公會禮物發放邏輯調整
                let seq = 1; 
                
                registrations.forEach(reg => {
                    if (targetMonths.includes(getMonthFromDateString(reg.memberBirthday))) {
                        csvContent += `"${seq++}","${getMonthFromDateString(reg.memberBirthday)}月","${reg.memberName}","${formatDisplayDate(reg.memberBirthday)}","會員本人","本人","-"\n`;
                    }
                    if (reg.guests && reg.guests.length > 0) {
                        reg.guests.forEach(guest => {
                            if (targetMonths.includes(getMonthFromDateString(guest.birthday))) {
                                csvContent += `"${seq++}","${getMonthFromDateString(guest.birthday)}月","${guest.name}","${formatDisplayDate(guest.birthday)}","攜伴","${guest.relationship||'親友'}","${reg.memberName}"\n`; 
                            }
                        });
                    }
                });
                
                if (seq === 1) return showMessage("清單內沒有符合壽星月份的資料");
                
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `壽星清單_${new Date().toISOString().slice(0,10)}.csv`;
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };

            const handleDelete = (id, name) => {
                setConfirmDialog({
                    message: `確定要永久刪除「${name}」的報名資料嗎？`,
                    onConfirm: () => {
                        onAction('delete', { userId: id });
                        setConfirmDialog(null);
                    }
                });
            };

            const handleUpdate = (updatedData) => {
                onAction('update', updatedData);
                setEditingDoc(null);
            };

            const adminBtnClass = "btn-icon flex-1 md:flex-none justify-center px-3 py-2.5 rounded-lg shadow-sm text-sm whitespace-nowrap gap-2 border";

            return (
                <div className="mt-2 md:mt-6">
                    <div className="flex flex-col gap-4 bg-white p-4 rounded-xl shadow-sm border border-gray-100 mx-2 md:mx-0">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <h2 className="text-xl md:text-2xl font-bold text-gray-800 flex items-center gap-2"><Icons.Users className="w-6 h-6 text-indigo-600" /> 報名管理</h2>
                                <div className="flex gap-3 mt-2 text-sm text-gray-500 bg-gray-50 p-2 rounded-lg">
                                    <span>會員: <b>{totalMembers}</b></span><span className="border-l pl-3">攜伴: <b>{totalGuests}</b></span><span className="border-l pl-3">總計: <b className="text-indigo-600 text-lg">{totalPeople}</b> 人</span>
                                </div>
                            </div>
                            <div className="flex flex-wrap gap-2 w-full md:w-auto">
                                <button onClick={exportBirthdayGiftList} className={`${adminBtnClass} bg-pink-500 hover:bg-pink-600 text-white border-pink-600`}><Icons.Gift className="w-4 h-4" /> 壽星清單</button>
                                <button onClick={exportToCSV} className={`${adminBtnClass} bg-green-600 hover:bg-green-700 text-white border-green-700`}><Icons.Download className="w-4 h-4" /> 參加清單</button>
                                <button onClick={onLogout} className={`${adminBtnClass} bg-gray-100 hover:bg-gray-200 text-gray-700 border-gray-200`}><Icons.LogOut className="w-4 h-4" /> 登出</button>
                            </div>
                        </div>
                    </div>
                    <div className="bg-white rounded-xl shadow-md overflow-hidden border border-gray-200 mt-4 mx-2 md:mx-0">
                        <div className="overflow-x-auto">
                            <table className="min-w-full divide-y divide-gray-200">
                                <thead className="bg-gray-50">
                                    <tr>
                                        <th className="px-4 py-3 text-left text-xs font-bold text-gray-500 whitespace-nowrap">操作</th>
                                        <th className="px-4 py-3 text-left text-xs font-bold text-gray-500 whitespace-nowrap">會員資料</th>
                                        <th className="px-4 py-3 text-left text-xs font-bold text-gray-500 min-w-[200px]">攜伴</th>
                                        <th className="px-4 py-3 text-left text-xs font-bold text-gray-500 whitespace-nowrap">人數</th>
                                    </tr>
                                </thead>
                                <tbody className="bg-white divide-y divide-gray-200">
                                    {registrations.length === 0 ? 
                                        <tr><td colSpan="4" className="text-center py-8 text-gray-400">讀取中或無資料...</td></tr> :
                                        registrations.map((reg, idx) => (
                                        <tr key={idx} className="hover:bg-indigo-50/30">
                                            <td className="px-4 py-4 whitespace-nowrap">
                                                <div className="flex gap-2">
                                                    <button onClick={() => setEditingDoc(reg)} className="btn-icon text-indigo-600 p-2 bg-indigo-50 rounded-lg hover:bg-indigo-100"><Icons.Edit className="w-4 h-4" /></button>
                                                    <button onClick={() => handleDelete(reg.userId, reg.memberName)} className="btn-icon text-red-500 p-2 bg-red-50 rounded-lg hover:bg-red-100"><Icons.Trash2 className="w-4 h-4" /></button>
                                                </div>
                                            </td>
                                            <td className="px-4 py-4 whitespace-nowrap">
                                                <div className="font-bold flex items-center gap-1">
                                                    {reg.memberName}
                                                    {reg.memberBringRod && <span title="自備釣竿" className="text-lg">🎣</span>}
                                                </div>
                                                <div className="text-sm text-indigo-600">{formatDisplayDate(reg.memberBirthday)}</div>
                                            </td>
                                            <td className="px-4 py-4">
                                                {(!reg.guests || reg.guests.length === 0) ? <span className="text-xs text-gray-400">無</span> : 
                                                    reg.guests.map((g, i) => (
                                                        <div key={i} className="text-sm mb-1 flex items-center gap-1 flex-wrap">
                                                            <span>{g.name}</span>
                                                            <span className="text-xs bg-indigo-50 text-indigo-700 px-1 rounded">[{g.relationship || '親友'}]</span> 
                                                            <span className="text-gray-400 text-xs">({formatDisplayDate(g.birthday)})</span>
                                                        </div>
                                                    ))
                                                }
                                            </td>
                                            <td className="px-4 py-4 whitespace-nowrap font-medium">{1 + (reg.guests?.length || 0)} 位</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    {editingDoc && <EditModal data={editingDoc} onClose={() => setEditingDoc(null)} onSave={handleUpdate} showMessage={showMessage} />}
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('form');
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [registrations, setRegistrations] = useState([]);
            const [isLoadingData, setIsLoadingData] = useState(true);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [refreshKey, setRefreshKey] = useState(0);
            const [showParkingInfo, setShowParkingInfo] = useState(false);
            const [viewImageModal, setViewImageModal] = useState(null);
            
            const [messageContent, setMessageContent] = useState(null);
            const [confirmDialog, setConfirmDialog] = useState(null);

            const showMessage = (msg) => setMessageContent(msg);

            useEffect(() => {
                if(GOOGLE_SCRIPT_URL.includes("請將這裡")) {
                    setIsLoadingData(false);
                    return;
                }
                
                setIsLoadingData(true);
                fetch(GOOGLE_SCRIPT_URL)
                    .then(res => res.json())
                    .then(data => {
                        setRegistrations(data.reverse());
                        setIsLoadingData(false);
                    })
                    .catch(err => {
                        console.error("Error fetching data:", err);
                        setIsLoadingData(false);
                    });
            }, [refreshKey]);

            const handleSubmission = async (formData) => {
                return await sendToGAS({ ...formData, action: 'add', userId: 'user_' + Date.now() + Math.random().toString(36).substr(2, 9) });
            };

            const handleAdminAction = async (action, data) => {
                const success = await sendToGAS({ ...data, action: action });
                if (success) {
                    showMessage(action === 'delete' ? '資料已成功刪除' : '資料修改成功');
                    setRefreshKey(prev => prev + 1);
                }
            };

            const sendToGAS = async (payload) => {
                if(GOOGLE_SCRIPT_URL.includes("請將這裡")) {
                    showMessage("請先設定 Google Apps Script 網址！");
                    return false;
                }
                setIsSubmitting(true);
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload),
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                    });
                    setIsSubmitting(false); return true;
                } catch (e) { 
                    console.error(e); 
                    showMessage("連線失敗，請檢查您的網路連線狀態"); 
                    setIsSubmitting(false); return false; 
                }
            };

            // --- 額滿邏輯計算 (只計算會員人數) ---
            const totalMembers = registrations.length;
            const totalGuests = registrations.reduce((acc, curr) => acc + (curr.guests?.length || 0), 0);
            const totalPeople = totalMembers + totalGuests;
            const isFull = totalMembers >= 72; // 會員達 72 人即額滿

            return (
                <div className="flex-grow">
                    <Header setView={setView} view={view} />
                    <main className="max-w-4xl mx-auto w-full px-0 md:px-4">
                        {view === 'form' && (
                            <>
                                <div className="mt-4 md:mt-6">
                                    <h2 className="text-2xl md:text-3xl font-extrabold text-gray-800 text-center mb-4 px-4">桃園市結構工程技師公會</h2>
                                    
                                    <div className="w-full mb-5">
                                        <img src="shrimp_banner.jpg" alt="公會活動" className="w-full h-auto object-cover rounded-lg shadow-sm" onError={(e) => { e.target.onerror = null; e.target.src = "https://via.placeholder.com/800x400?text=Shrimp+Fishing+Event" }} />
                                    </div>

                                    <div className="px-4">
                                        <div className="flex flex-col md:flex-row items-center justify-center gap-3 mb-2 bg-blue-50 p-3 rounded-lg border border-blue-100">
                                            <p className="text-center text-blue-800 text-sm md:text-base font-medium">本活動交通部分請會員自行安排，敬請見諒。</p>
                                            <button onClick={() => setShowParkingInfo(true)} className="text-sm bg-blue-600 text-white px-5 py-2 rounded-full hover:bg-blue-700 transition flex items-center gap-1.5 shadow-sm active:scale-95">
                                                <Icons.MapPin className="w-4 h-4" /> 釣蝦場停車資訊
                                            </button>
                                        </div>
                                        <p className="text-center text-gray-500 text-sm md:text-base mb-4 font-medium">報名截止日期為 2026/08/20 PM 11:59</p>
                                    </div>
                                </div>
                                
                                {isLoadingData ? (
                                    <div className="flex flex-col items-center justify-center py-16 bg-white rounded-xl shadow-sm border border-gray-100 mt-6 mx-2 md:mx-0">
                                        <div className="animate-spin rounded-full h-12 w-12 border-4 border-indigo-100 border-t-indigo-600 mb-4"></div>
                                        <p className="text-gray-500 font-medium tracking-wide">系統連線中，正在確認剩餘名額...</p>
                                    </div>
                                ) : isFull ? (
                                    <div className="flex flex-col items-center justify-center p-8 md:p-12 bg-white rounded-xl shadow-lg mt-6 text-center border-t-4 border-red-500 mx-2 md:mx-0 fade-in">
                                        <div className="bg-red-50 p-5 rounded-full mb-5">
                                            <Icons.AlertTriangle className="w-16 h-16 text-red-500" />
                                        </div>
                                        <h2 className="text-2xl md:text-3xl font-extrabold text-gray-800 mb-3">報名已額滿</h2>
                                        <p className="text-gray-600 mb-6 text-lg">感謝您的熱情參與！<br/>本次活動報名人數已達上限<br/>(會員已滿 72 人)。</p>
                                        <div className="bg-gray-50 p-4 rounded-lg border border-gray-200 text-sm text-gray-500 w-full max-w-md mx-auto">
                                            若有任何疑問或需登記候補，請聯繫公會秘書處。
                                        </div>
                                    </div>
                                ) : (
                                    <RegistrationForm 
                                        onSubmit={handleSubmission} 
                                        isSubmitting={isSubmitting} 
                                        showMessage={showMessage} 
                                        currentMembers={totalMembers}
                                        currentGuests={totalGuests}
                                        currentTotal={totalPeople}
                                    />
                                )}
                            </>
                        )}
                        
                        {/* 彈窗渲染區 */}
                        {showParkingInfo && <ParkingModal onClose={() => setShowParkingInfo(false)} />}
                        {viewImageModal && <ImageViewer src={viewImageModal.src} title={viewImageModal.title} onClose={() => setViewImageModal(null)} />}
                        {messageContent && <MessageBox message={messageContent} onClose={() => setMessageContent(null)} />}
                        {confirmDialog && <ConfirmBox message={confirmDialog.message} onConfirm={confirmDialog.onConfirm} onCancel={() => setConfirmDialog(null)} />}
                        
                        {view === 'admin' && (!isAdminLoggedIn ? <AdminLogin onLogin={setIsAdminLoggedIn} /> : <AdminDashboard registrations={registrations} onLogout={() => setIsAdminLoggedIn(false)} onAction={handleAdminAction} showMessage={showMessage} setConfirmDialog={setConfirmDialog} />)}
                    </main>
                    <footer className="mt-12 py-6 text-center text-gray-400 text-sm bg-gray-100 border-t border-gray-200">&copy; 2026 桃園市結構工程技師公會 by 曉芬</footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
